name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    release-please:
        permissions:
            contents: write
            pull-requests: write
        uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
        with:
            approvers: "ransomr jjallaire dragonstyle"
        secrets: inherit

    # Release announcement to flow's Slack channel (shared converter action).
    # Needs publish so a rejected or failed PyPI publish is never announced.
    announce:
        needs: [release-please, publish]
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        steps:
            - uses: meridianlabs-ai/actions/slack-release-announce@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
              with:
                  webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                  title: ":rocket: inspect-flow ${{ needs.release-please.outputs.tag_name }} released"
                  release-url: ${{ needs.release-please.outputs.html_url }}
                  release-body: ${{ needs.release-please.outputs.body }}

    # Publish stays in-repo (PyPI trusted publishing can't run from a cross-repo
    # reusable workflow; keeping it here leaves the trusted-publisher config for
    # workflow release.yaml unchanged).
    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Required for OIDC/trusted publishing
        environment:
            name: pypi
            url: https://pypi.org/p/inspect-flow

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # Get all tags for version detection

            # The build toolchain pinned with hashes, as in publish.yaml (which
            # says how to update the file). This job holds id-token, so it
            # restores no Actions cache.
            - name: Install build toolchain
              uses: meridianlabs-ai/actions/install-python-dependencies@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
              with:
                  versions: hashed-requirements
                  python-version: "3.11"
                  requirements-file: scripts/build-dist/requirements.txt
                  package-format: wheels-only
                  actions-cache: none
                  environment-dir: ${{ runner.temp }}/build-venv

            - name: Show current version
              run: |
                  echo "Version: $(git describe --tags --always)"

            - name: Build
              run: |
                  "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
                  ls -la dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
