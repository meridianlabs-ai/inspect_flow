name: Publish Package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-flow

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Get all tags for version detection

      # id-token: write, so no Actions cache restore.
      - uses: meridianlabs-ai/actions/setup-uv@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
        with:
          python-version: "3.14"
          actions-cache: none

      - name: Show current version
        run: |
          echo "Version: $(git describe --tags --always)"

      - name: Build
        run: |
          uv build
          ls -la dist/

      - name: Publish to PyPI
        if: inputs.confirm == 'yes'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
