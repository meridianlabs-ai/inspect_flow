name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Read-only for every job that runs code from the checkout: an agent may land
# build and dependency configuration (pyproject.toml, uv.lock; the tier-2
# opt-in, meridianlabs-ai/agents design/executed-paths-residual.md), and these
# jobs run it. The coverage writes happen where no checkout code runs: the PR
# comment from coverage-comment.yml (workflow_run), the data branch from the
# `coverage` job below.
permissions:
  contents: read

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Format with Ruff
        run: uv run ruff format --check .
      - name: Check public API docstrings
        run: uv run python scripts/check_public_docstrings.py

  py-type:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Type check with pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the coverage action reads the PR diff
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with coverage
        timeout-minutes: 10
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-branch
          --runslow
      - name: Ensure no files modified during tests
        run: |
          if [[ $(git status --porcelain) != "" ]]
          then
            echo "Checked in files modified by tests. If expected, please run locally and check in the changes."
            git status
            git diff
            exit 1
          fi
      # The action's PR mode with a read-only token: it cannot post, so it
      # writes the comment to a file, which coverage-comment.yml posts (the
      # action's documented two-workflow split).
      - name: Coverage comment
        id: coverage_comment
        if: matrix.python-version == '3.10' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90
      - name: Store the coverage comment
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          # coverage-comment.yml's action reads these default names.
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Store the coverage data
        if: matrix.python-version == '3.10' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  # Main's coverage data, on the action's data branch. Runs nothing from the
  # checkout: the action's own container reads the .coverage file py-test
  # stored and the source it covers. v3 pushes with the credentials
  # actions/checkout persists (v4.1 and later take the token instead).
  coverage:
    needs: py-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: coverage-data
      - name: Coverage data
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 90

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # uv installs what uv.lock names, from where it names it. An agent may
      # land uv.lock (tier 2) but not this check (.github/, tier 1). The
      # runner's own Python reads the lock before anything from the checkout
      # runs, here in a required check.
      - name: Check uv.lock package sources
        shell: python3 {0}
        run: |
          import sys
          import tomllib

          SOURCES = [
              {"registry": "https://pypi.org/simple"},
              {"editable": "."},
              {"editable": "tests/local_eval"},
          ]
          FILES = "https://files.pythonhosted.org/"

          with open("uv.lock", "rb") as f:
              lock = tomllib.load(f)
          bad = []
          for package in lock.get("package", []):
              name = f"{package.get('name')} {package.get('version', '')}".strip()
              if package.get("source") not in SOURCES:
                  bad.append(f"{name}: source {package.get('source')}")
              for artifact in [package.get("sdist", {}), *package.get("wheels", [])]:
                  if artifact and not str(artifact.get("url", "")).startswith(FILES):
                      bad.append(f"{name}: artifact {artifact}")
          for line in bad:
              print(f"::error file=uv.lock::{line}")
          if bad:
              sys.exit(
                  f"uv.lock names a source other than PyPI or this repository's "
                  f"editable packages ({len(bad)} entries above)."
              )
          print(f"uv.lock: {len(lock.get('package', []))} packages, all from PyPI or editable here.")
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install build dependencies
        run: uv pip install --system build
      - name: Build package
        run: python -m build
      - name: Verify package
        run: |
          uv pip install --system dist/*.whl
          python -c "import inspect_flow; print('Package imported successfully')"

  check-type-gen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate types
        run: uv run python src/inspect_flow/_types/type_gen.py
      - name: Ensure schema and types changes are checked in
        run: |
          if [[ $(git status --porcelain) != "" ]]
          then
            echo "Generated types are out of date. Please run python src/inspect_flow/_types/type_gen.py and check in the changes."
            git status
            git diff
            exit 1
          fi
