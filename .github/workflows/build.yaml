name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Read-only for every job that runs code from the checkout: an agent may land
# build and dependency configuration (pyproject.toml, uv.lock; the tier-2
# opt-in, meridianlabs-ai/agents design/executed-paths-residual.md), and these
# jobs run it.
permissions:
  contents: read

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Lint with Ruff
        run: uv run --no-sync ruff check .
      - name: Format with Ruff
        run: uv run --no-sync ruff format --check .
      - name: Check public API docstrings
        run: uv run --no-sync python scripts/check_public_docstrings.py
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-type:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Type check with pyright
        run: uv run --no-sync pyright
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        timeout-minutes: 10
        run: uv run --no-sync pytest --runslow
      - name: Ensure no files modified during tests
        run: |
          if [[ $(git status --porcelain) != "" ]]
          then
            echo "Checked in files modified by tests. If expected, please run locally and check in the changes."
            git status
            git diff
            exit 1
          fi
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv installs what uv.lock names, from where it names it. An agent may
      # land uv.lock (tier 2) but not this check (.github/, tier 1). The
      # runner's own Python reads the lock before anything from the checkout
      # runs, here in a required check.
      - name: Check uv.lock package sources
        shell: python3 {0}
        run: |
          import sys
          import tomllib

          SOURCES = [
              {"registry": "https://pypi.org/simple"},
              {"editable": "."},
              {"editable": "tests/local_eval"},
          ]
          FILES = "https://files.pythonhosted.org/"

          with open("uv.lock", "rb") as f:
              lock = tomllib.load(f)
          bad = []
          for package in lock.get("package", []):
              name = f"{package.get('name')} {package.get('version', '')}".strip()
              if package.get("source") not in SOURCES:
                  bad.append(f"{name}: source {package.get('source')}")
              for artifact in [package.get("sdist", {}), *package.get("wheels", [])]:
                  if artifact and not str(artifact.get("url", "")).startswith(FILES):
                      bad.append(f"{name}: artifact {artifact}")
          for line in bad:
              print(f"::error file=uv.lock::{line}")
          if bad:
              sys.exit(
                  f"uv.lock names a source other than PyPI or this repository's "
                  f"editable packages ({len(bad)} entries above)."
              )
          print(f"uv.lock: {len(lock.get('package', []))} packages, all from PyPI or editable here.")
      # The build toolchain that release.yaml uses, pinned with hashes. To
      # update the file, see release.yaml.
      - name: Install build toolchain
        uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: hashed-requirements
          python-version: ${{ matrix.python-version }}
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          environment-dir: ${{ runner.temp }}/build-venv
      - name: Build package
        id: build
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
      # The locked runtime dependencies, without the dev group and without the
      # project, then the wheel with --no-deps.
      - uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          default-dependency-groups: exclude
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
      - name: Verify package
        # -I so the import resolves to the installed wheel, not the checkout's src/.
        run: .venv/bin/python -I -c "import inspect_flow; print('Package imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  check-type-gen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@40b7c888e3a8c34a083e8354099b18d1d7e936a0 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Generate types
        run: uv run --no-sync python src/inspect_flow/_types/type_gen.py
      - name: Ensure schema and types changes are checked in
        run: |
          if [[ $(git status --porcelain) != "" ]]
          then
            echo "Generated types are out of date. Please run python src/inspect_flow/_types/type_gen.py and check in the changes."
            git status
            git diff
            exit 1
          fi
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci
