# Triages the "Inspect AI Main CI" canary (which runs flow against inspect-ai's
# git main every 3 hours) when it fails on a scheduled run.
#
# The canary going red usually means an unreleased inspect-ai change has broken
# flow — but not always: an incidental cause (a dev-tool/linter upgrade
# reformatting code, a flake, an unrelated dependency) can trip it too, since
# the canary upgrades ALL dev dependencies. So "canary red" must be diagnosed,
# not assumed to mean "inspect-ai broke us".
#
# Four jobs, split so that no job that runs the agent holds a write credential
# (credential separation, Phase 2; the landing shape is meridianlabs-ai/agents
# design/architecture.md → "Landing job"):
#   triage-gate — deterministic (trusted). Mints a one-hour GitHub App token,
#     opens ONE tracking issue (deduped on the `inspect-ai-main` label) and,
#     while it stays open, appends a "still failing" comment on later failures
#     instead of piling up duplicate issues. Closing the issue (once flow is
#     fixed) lets the next failure open a fresh one. Emits `needs_triage` =
#     true only while the open issue lacks a `triaged` label.
#   triage-agent — runs the dev agent (headless, job token ONLY: read-only, no
#     gh writes, no push) ONLY when needs_triage is true, so the 3-hourly
#     repeats never spend a model run or open a duplicate PR. The agent
#     root-causes the failure, then either commits a fix locally or classifies
#     it as deferred to the next inspect-ai release, and writes its analysis
#     and PR text as files. `emit-landing` packages the commits and a manifest
#     describing what to post.
#   triage-land — trusted, a fresh runner that checks out nothing: mints an
#     App token for this repo, validates the manifest, pushes the branch, opens
#     the PR whose body says `Fixes #<issue>` as a draft assigned to ransomr,
#     posts the analysis on the issue, applies `hold:release` for a
#     deferral and `triaged` when done, and reports any agent error there.
#     Gating on the label (not "was just opened") makes triage retry-safe: an agent that dies before
#     finishing leaves no label, so the next failure re-triages.
#   close-on-green — the inverse of triage-gate. The tracking issue means "the
#     canary is currently red"; a green scheduled run is the ground-truth signal
#     that flow is no longer broken, so it closes the open issue. This is the
#     ONLY reliable close path: a fix PR's `Fixes #<n>` link closes the issue
#     only for causes that get a PR and only when the keyword is well-formed, so
#     a self-resolved break or a no-PR flake would otherwise leave the issue
#     open forever — and a stale open issue wedges the dedup above (later
#     failures pile onto it instead of opening a fresh, correctly-scoped one).
#     Exception: a `hold:release` issue is deliberately left open to defer to
#     the next inspect-ai release, and in-flux upstream changes are the ones
#     most likely to flap green transiently — so close-on-green skips those,
#     keeping the deferred thread (and its human context) intact until the
#     release actually reconciles it.
#
# Dedup is keyed on the `inspect-ai-main` label, not the failure signature: the
# canary has one meaning ("flow is broken against inspect-ai main"), so one open
# issue at a time is the right granularity.
#
# workflow_run only fires for workflow files on the default branch, so this
# takes effect once merged to main. workflow_dispatch lets a human point it at a
# specific failed run_id.

name: Inspect AI Main Failure Issue

on:
  workflow_run:
    workflows: ["Inspect AI Main CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a failed Inspect AI Main CI run to file"
        required: true
        type: string

concurrency:
  group: inspect-ai-main-failure
  cancel-in-progress: false

jobs:
  triage-gate:
    # Only file for failed *scheduled* canary runs (skip successes and manual
    # dispatches of the canary itself). A workflow_dispatch of THIS workflow
    # always proceeds against the supplied run_id.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
      issue_url: ${{ steps.issue.outputs.issue_url }}
      needs_triage: ${{ steps.issue.outputs.needs_triage }}
      # The fix branch lives under the tracking issue's own namespace
      # (`inspect-ai-main/<issue>/`, delimiter-terminated), which is what the
      # land job pins the manifest's branch to; the run id keeps a re-triage
      # (an agent that died before finishing) off an earlier run's branch.
      branch: inspect-ai-main/${{ steps.issue.outputs.issue_number }}/${{ github.run_id }}
    env:
      # `secrets` is not available in a step `if`; the client id is not secret.
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}
    steps:
      # A short-lived meridian-marvin app token, scoped to this repo, carries
      # the org-projects permission needed to add the issue to the Atlas board;
      # github.token cannot reach org projects. actions:read is for `gh run
      # view` on the failed canary run. Each step below falls back to
      # github.token where the app secrets are absent, so issue create/comment
      # still work (the board step is best-effort). The `steps` context is not
      # available in job-level `env`, hence the per-step GH_TOKEN.
      - name: Mint app token
        id: mint
        if: env.MARVIN_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_flow
          permission-actions: read
          permission-issues: write
          permission-organization-projects: write

      - name: Collect failure context
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || github.token }}
        run: |
          set -uo pipefail
          gh run view "$RUN_ID" --repo "$REPO" \
            --json jobs,displayTitle,headBranch,headSha,url,createdAt > run.json || echo '{}' > run.json
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > failed.log 2>&1 || true
          # Keep the last 200 lines of failed-step output — failures are near
          # the end and the issue body must stay readable.
          tail -n 200 failed.log > failed.tail.log || true

      # The labels triage-land records the agent's outcome with. Created here,
      # before any untrusted content is read: the agent job holds no write
      # token. Idempotent.
      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || github.token }}
        run: |
          gh label create triaged --repo "$REPO" \
            --description "Canary failure has been root-caused by the triage agent" \
            --color 0E8A16 2>/dev/null || true
          gh label create hold:release --repo "$REPO" \
            --description "Deferred until the next inspect-ai release reconciles it" \
            --color FBCA04 2>/dev/null || true

      - name: Open or update tracking issue
        id: issue
        run: |
          set -uo pipefail

          gh label create inspect-ai-main --repo "$REPO" \
            --description "Flow broken against inspect-ai git main (canary CI)" \
            --color B60205 2>/dev/null || true

          existing=$(gh issue list --repo "$REPO" --state open \
            --label inspect-ai-main --limit 1 --json number,url,labels \
            --jq '.[0] // empty')

          if [ -n "$existing" ]; then
            number=$(echo "$existing" | jq -r '.number')
            url=$(echo "$existing" | jq -r '.url')
            echo "Existing open issue $url — commenting instead of opening a new one."
            gh issue comment "$url" --repo "$REPO" --body "$(printf 'Still failing on a later run.\n\n- Failed run: %s\n- Triage run: https://github.com/%s/actions/runs/%s' "$RUN_URL" "$REPO" "$GITHUB_RUN_ID")"
            # Re-triage only while the issue has not yet been triaged (retry-safe:
            # an agent that died before labeling leaves no `triaged` label).
            if echo "$existing" | jq -e '.labels | map(.name) | index("triaged")' >/dev/null; then
              needs_triage=false
            else
              needs_triage=true
            fi
            {
              echo "issue_number=$number"
              echo "issue_url=$url"
              echo "needs_triage=$needs_triage"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          failed_jobs=$(jq -r '.jobs // [] | map(select(.conclusion=="failure")) | if length==0 then "(none reported)" else map("- " + .name) | join("\n") end' run.json)
          log_tail=$(cat failed.tail.log 2>/dev/null || echo "(no failed-step logs available)")

          body=$(cat <<EOF
          ## Summary

          The [Inspect AI Main CI](.github/workflows/inspect_ai_main.yaml) canary — which installs inspect-ai from git \`main\` and runs flow against it — failed on a scheduled run. This usually means an unreleased inspect-ai change has broken flow and will need reconciliation before that release lands, but it can also be an incidental cause (a dev-tool upgrade, a flake, an unrelated dependency). The triage agent will root-cause it and either open a fix PR or defer it to the next release.

          ## Failing jobs

          $failed_jobs

          ## Failed step output (last 200 lines)

          <details>
          <summary>failed.log</summary>

          \`\`\`
          $log_tail
          \`\`\`

          </details>

          ## Links

          - Failed run: $RUN_URL
          - This issue was opened automatically by \`.github/workflows/inspect-ai-main-failure.yml\`.
          EOF
          )

          url=$(gh issue create --repo "$REPO" \
            --title "Inspect AI Main CI failing against inspect-ai main" \
            --label inspect-ai-main \
            --assignee ransomr \
            --body "$body")
          # No `set -e`, so a transient create failure would otherwise emit
          # needs_triage=true with an empty issue number and burn a broken
          # agent run. Fail loudly instead.
          if [ -z "$url" ]; then
            echo "::error::gh issue create failed — not triggering triage."
            exit 1
          fi
          number=$(echo "$url" | sed 's#.*/##')
          echo "Opened $url"
          {
            echo "issue_number=$number"
            echo "issue_url=$url"
            echo "needs_triage=true"
          } >>"$GITHUB_OUTPUT"

          # Best-effort: add to the org Atlas board (needs the app token's
          # org-projects permission). Never fail the run if the token can't
          # reach the project.
          gh project item-add 1 --owner meridianlabs-ai --url "$url" || \
            echo "Could not add to Atlas board (missing project scope?) — skipping."
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

  # Root-cause the failure. UNTRUSTED: job token only, read-only, and this job
  # references no secret. The agent reads the failed run's logs (third-party
  # input shaped by whatever the tests exercised) and runs uv/python on the
  # checkout, so nothing it can reach may write to GitHub: it commits the fix
  # locally and writes its analysis, PR text and classification as files;
  # every write happens in triage-land from the validated manifest. A
  # scheduled/machine job cannot summon @auto by mention/label (the kickoff
  # gates reject bot actors), which is why claude-code-action is invoked
  # directly with the prompt. The landed PR carries no `auto` label: the
  # agent read logs that anyone who can shape a test can shape, so its PR is
  # a draft for ransomr to review before any agent or loop acts on it
  # (decision: Ransom, 2026-09-24, after #859 sat labelled `auto` with no
  # review, since the reviewer is on demand only). actions:read is for
  # `gh run view --log-failed`; id-token is the Anthropic WIF OIDC exchange.
  triage-agent:
    needs: triage-gate
    if: needs.triage-gate.outputs.needs_triage == 'true'
    runs-on: ubuntu-latest
    # Agent runs restore caches, never save them (meridianlabs-ai/agents: design/agent-cache-scope.md).
    cache-mode: read
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      defer: ${{ steps.manifest.outputs.defer }}
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # The branch the land job pushes to (its name is pinned there by
      # `branch-prefix`), and the SHA the landing manifest is anchored to:
      # commits above it are the run's landable work.
      - name: Start the fix branch
        id: base
        env:
          BRANCH: ${{ needs.triage-gate.outputs.branch }}
          OUT: ${{ runner.temp }}/agent-out
        run: |
          set -euo pipefail
          git checkout --quiet -b "$BRANCH"
          mkdir -p "$OUT"
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] \
            || { echo "::error::The fix branch starts at $sha, but the land job pins the run's start to github.sha ($GITHUB_SHA); the checkout must be at github.sha."; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Same convention the reusable dev-agent workflow uses: provision the
      # project venv so the agent can run pytest/ruff/pyright and introspect
      # installed inspect_ai signatures.
      - name: Provision project environment
        uses: ./.github/actions/claude-setup

      - name: Read latest and last-reconciled inspect-ai versions
        id: versions
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://pypi.org/pypi/inspect-ai/json | jq -r .info.version)
          reconciled=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['inspect_flow']['inspect-reconciled-version'])")
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "reconciled=$reconciled" >>"$GITHUB_OUTPUT"

      # Direct (headless) invocation, mirroring the dev-agent invocation in
      # meridianlabs-ai/agents/.github/workflows/claude.yml and inspect-update.yml.
      # The anthropic_* values are Workload Identity Federation identifiers, not
      # secrets. The settings allow-list matches the inspect-update agent's,
      # extended with `Bash(uvx:*)` so triage can reproduce failures with a
      # pinned tool version (e.g. `uvx ruff@latest format` for a ruff bump); no
      # `git push`. The job token is passed explicitly so the action does not
      # mint its own App token: `gh` here can read (the failed run's logs) and
      # nothing else. Commits carry the App's bot identity, since the App token
      # pushes them.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GIT_AUTHOR_NAME: meridian-marvin[bot]
          GIT_AUTHOR_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: meridian-marvin[bot]
          GIT_COMMITTER_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ github.token }}
          settings: >-
            {"permissions":{"allow":["Read","Edit","Write",
            "WebFetch(domain:raw.githubusercontent.com)",
            "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
            "Bash(pip3:*)","Bash(uv:*)","Bash(uvx:*)","Bash(python:*)","Bash(python3:*)",
            "Bash(gh:*)",
            "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
            "Bash(git checkout:*)","Bash(git switch:*)",
            "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
            "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
            "Bash(git remote:*)",
            "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
          claude_args: >-
            --model opus
            --fallback-model default
            --add-dir ${{ runner.temp }}/agent-out
          prompt: |
            You are the canary-triage agent for inspect_flow. The "Inspect AI
            Main CI" canary — which upgrades all dev dependencies, installs
            inspect-ai from git main, and runs flow's lint/type/test/type-gen
            checks against it — failed on a scheduled run. Tracking issue:
            #${{ needs.triage-gate.outputs.issue_number }}. Failed canary run:
            ${{ env.RUN_URL }} (run id ${{ env.RUN_ID }}).

            Your GitHub token is read-only: `gh` works for reads (the failed
            run's logs, issues, PRs), but you cannot push, open a PR, comment
            or label, and must not try. Your work lands after this job ends: a
            trusted job pushes the commits you make on the current branch
            (${{ needs.triage-gate.outputs.branch }}, already checked out) and
            opens the PR, posts the files you write under
            ${{ runner.temp }}/agent-out (call it OUT below), and applies the
            labels.

            Read AGENTS.md first and follow it throughout.

            Context: the latest inspect-ai release on PyPI is
            ${{ steps.versions.outputs.latest }}; flow's last-reconciled version
            (pyproject.toml [tool.inspect_flow] inspect-reconciled-version) is
            ${{ steps.versions.outputs.reconciled }}.

            1. ROOT-CAUSE the failure. Inspect the failed logs
               (`gh run view ${{ env.RUN_ID }} --repo ${{ github.repository }} --log-failed`)
               and reproduce locally on the current checkout: `uv sync --dev
               --upgrade`, `uv pip install git+https://github.com/UKGovernmentBEIS/inspect_ai.git`,
               then run the failing check(s). Determine the actual cause — do NOT
               assume it is an inspect-ai break.

            2. CLASSIFY into exactly one bucket:
               a. INCIDENTAL (not inspect-ai): a dev-tool/linter/dependency
                  upgrade that reformats or newly flags code, a flake, or an
                  unrelated dependency. → fix now.
               b. CLEAN inspect-ai reconciliation: an inspect-ai main change that
                  is stable and can be cleanly reconciled against flow today
                  (small, unambiguous). → fix now.
               c. IN-FLUX / AMBIGUOUS inspect-ai change: still moving on main,
                  risky to chase, or needs a human decision. The weekly
                  inspect-update workflow will reconcile it properly once the
                  version is released. → wait.

            3. If FIX NOW (a or b): on the current branch, implement the
               smallest correct fix, verify it with `ruff format`,
               `ruff check --fix`, `pyright`, and the relevant tests, and
               commit it (git add / git commit; never push, never switch
               branches). Exactly ONE PR is opened for you from those
               commits, as a draft for the maintainer to review, and linked
               to the tracking issue. Describe it:
               - OUT/pr-title.txt: one line, a conventional-commit title per
                 AGENTS.md (a linter/formatting or dependency fix is not
                 `feat:`/`fix:`).
               - OUT/pr-body.md: what changed and why. The
                 "Fixes #${{ needs.triage-gate.outputs.issue_number }}" line is
                 added for you; do not write it.

            4. If WAIT (c): make no commits. Write the single word `wait` to
               OUT/classification.txt; the `hold:release` label is applied to
               the issue for you and it stays open. @mention @ransomr in your
               analysis (below).

            5. In ALL cases, write your root-cause analysis to
               OUT/issue-comment.md (Markdown; it is posted as a comment on
               issue #${{ needs.triage-gate.outputs.issue_number }}), with
               the rationale for waiting in the WAIT case. The `triaged`
               label is applied for you once your work has landed, so later
               canary failures don't re-triage it. If you cannot complete the
               task, say what blocked you in OUT/issue-comment.md and mention
               @ransomr.

      # Served-model table, cost, duration and turn count to the job summary
      # (no transcript is uploaded as an artifact). Its fallback/refusal note,
      # if any, travels to the land job as the manifest's
      # provenance_comment_file. Best-effort, always exits 0.
      - name: Model provenance
        id: provenance
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: opus

      # Surface agent errors the action swallows. A model API error (overload /
      # 529, a model 404, etc.) leaves the run green at the workflow level but
      # with no result. This job cannot post: the message becomes the
      # manifest's `error` (fail_run true) and the land job posts it on the
      # tracking issue and fails the run after everything else landed. Exits 0
      # on every path: the red X is the land job's.
      - name: Surface agent errors
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          [ -f "$file" ] && err=$(jq -r '(if type=="array" then . else .messages end) | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" != "success" ]; then
            err="the Claude Code step ended with outcome '$CLAUDE_OUTCOME' before producing a result (see the job logs)."
          fi
          [ -z "$err" ] && { echo "No agent error detected."; exit 0; }
          echo "::error::Claude run did not complete: $err"
          printf 'The canary triage agent errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload or a model-availability blip); if it persists see https://status.claude.com.\n' "$err" >"$ERROR_FILE"

      # Everything the land job pushes and posts, as ONE JSON object for
      # emit-landing's manifest-extra (schema: agents
      # .github/actions/emit-landing/README.md). The agent's files are DATA:
      # they are copied (capped under the validator's 64 KiB file limit) and
      # referenced by name, never interpolated into a command. Fields:
      #   pr        — open the PR for the branch when HEAD moved past the start
      #               SHA; title from OUT/pr-title.txt (first line, control
      #               characters stripped), body = "Fixes #<issue>" +
      #               OUT/pr-body.md, no labels, issue for the "Opened" link
      #   comments  — OUT/issue-comment.md on the tracking issue
      #   provenance_comment_file — the model-provenance note, if any
      #   error     — the Surface step's message and/or the missing analysis,
      #               fail_run true; posted on the PR (or the issue) by `land`
      # The labels the manifest cannot express (`triaged`, `hold:release` on
      # the tracking issue) are applied by triage-land from this job's `defer`
      # output, which is true only when OUT/classification.txt says `wait`.
      - name: Compose landing manifest
        id: manifest
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          OUT: ${{ runner.temp }}/agent-out
          EXTRA: ${{ runner.temp }}/landing-extra.json
          START: ${{ steps.base.outputs.sha }}
          ISSUE: ${{ needs.triage-gate.outputs.issue_number }}
          PROV_NOTE: ${{ steps.provenance.outputs.note }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          extra='{}'
          err=""
          tip=$(git rev-parse HEAD 2>/dev/null || echo "$START")
          if [ -n "$START" ] && [ "$tip" != "$START" ]; then
            title=$( { head -n1 "$OUT/pr-title.txt" 2>/dev/null || true; } | tr -d '\000-\037\177' | head -c 200)
            [ -n "$title" ] || title="chore: fix the inspect-ai main canary failure (#$ISSUE)"
            { printf 'Fixes #%s\n\n' "$ISSUE"; head -c 60000 "$OUT/pr-body.md" 2>/dev/null || true; } >"$DIR/pr-body.md"
            extra=$(jq -c --arg t "$title" --argjson n "$ISSUE" \
              '.pr = {open: true, title: $t, body_file: "pr-body.md", labels: [], issue: $n}' <<<"$extra")
          fi
          defer=false
          if [ "$( { head -n1 "$OUT/classification.txt" 2>/dev/null || true; } | tr -d '[:space:]')" = "wait" ]; then
            defer=true
          fi
          echo "defer=$defer" >>"$GITHUB_OUTPUT"
          if [ -s "$OUT/issue-comment.md" ]; then
            head -c 60000 "$OUT/issue-comment.md" >"$DIR/issue-comment.md"
            extra=$(jq -c --argjson n "$ISSUE" '.comments = [{number: $n, body_file: "issue-comment.md"}]' <<<"$extra")
          else
            err="The agent left no root-cause analysis (issue-comment.md)."
          fi
          if [ -n "${PROV_NOTE:-}" ]; then
            printf '%s\n' "$PROV_NOTE" >"$DIR/prov.md"
            extra=$(jq -c '.provenance_comment_file = "prov.md"' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            err=$(printf '%s%s' "$(cat "$ERROR_FILE")" "${err:+$(printf '\n\n%s' "$err")}")
          fi
          if [ -n "$err" ]; then
            msg=$(printf '⚠️ The canary triage agent did not complete.\n\n%s' "$err")
            extra=$(jq -c --arg msg "$msg" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: defer=$defer $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the manifest
      # for the land job. This action holds no token.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          start-sha: ${{ steps.base.outputs.sha }}
          branch: ${{ needs.triage-gate.outputs.branch }}
          # The SAME value the land job gets: the validator pins the
          # manifest's issue_number to it, and it is where the final report
          # goes when the manifest never validated.
          issue-number: ${{ needs.triage-gate.outputs.issue_number }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json

  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. Runs whatever the agent job did (always()), so an agent failure
  # is reported on the tracking issue instead of dying in the log; skipped
  # when the gate found nothing to triage or failed before naming the issue.
  triage-land:
    needs: [triage-gate, triage-agent]
    if: always() && needs.triage-gate.result == 'success' && needs.triage-gate.outputs.needs_triage == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # fetch the start SHA (land's read token)
      actions: read # artifact download
    steps:
      # Scoped to this repo and to this job's writes: the push (contents), the
      # PR and its label (pull requests), the analysis comment, the "Opened"
      # link, the issue labels and the error report (issues). The push and the
      # PR come from meridian-marvin[bot], so CI and the reviewer trigger as
      # they did for the machine account.
      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` takes the App ID or the Client ID; the action has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_flow
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Land
        id: land
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          token: ${{ steps.mint.outputs.token }}
          # The manifest creates no issues (the gate owns the tracking issue).
          allowed-issue-repos: ""
          # The same value emit-landing got above (a gate output, computed
          # before any untrusted code ran): the validator pins the manifest's
          # issue_number to it, and it is the trusted target for the final
          # report when the manifest never validated.
          issue-number: ${{ needs.triage-gate.outputs.issue_number }}
          # No PR names a head ref to pin the branch to, so the tracking
          # issue's namespace (see the gate's `branch` output) is the pin: the
          # manifest's branch must start with `inspect-ai-main/<issue>/`, and
          # the trailing delimiter keeps another issue's branches out of it.
          branch-prefix: inspect-ai-main/${{ needs.triage-gate.outputs.issue_number }}/
          # The run's start as trusted context records it: github.sha comes
          # from the event payload, and the agent job's `base` step fails
          # unless its checkout is at exactly this commit. The validator
          # refuses a manifest that carries commits unless its start_sha
          # equals this, so the agent job cannot name another start and land
          # history the run never began from (agents#137, finding 4628444).
          start-sha: ${{ github.sha }}
          # The labels the agent job's composer puts on the PR (none), pinned
          # so a manifest rewritten after it cannot add any (agents#132).
          allowed-pr-labels: '[]'
          # The PR goes to the maintainer, not to an agent loop: opened as a
          # draft and assigned to ransomr (agents#175). The caller's decision,
          # so these are land inputs, not manifest keys.
          pr-draft: "true"
          pr-assignees: ransomr

      # The issue labels the manifest cannot express, applied deterministically
      # once the agent's work has landed. `triaged` keeps later canary failures
      # from re-triaging; it is applied when the landing succeeded, or when a PR
      # was opened even though a later step failed (re-triaging would open a
      # duplicate PR). An agent that died before finishing (manifest error, no
      # analysis) leaves no label, so the next failure re-triages, as before.
      # `hold:release` marks the WAIT classification (the agent job's `defer`
      # output, true only for the literal `wait`), which close-on-green
      # respects. Both labels go in ONE mutation: a `triaged` that landed
      # without its `hold:release` would stop re-triage while close-on-green
      # closes the deliberately deferred issue on the next green run.
      - name: Apply the triage labels
        id: labels
        if: always() && steps.mint.outcome == 'success' && (steps.land.outcome == 'success' || steps.land.outputs.pr_number != '')
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.triage-gate.outputs.issue_number }}
          DEFER: ${{ needs.triage-agent.outputs.defer }}
        run: |
          set -euo pipefail
          labels=triaged
          if [ "$DEFER" = "true" ]; then
            labels="hold:release,triaged"
          fi
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "$labels"
          echo "Applied '$labels' to #$ISSUE."

      # Deterministic failure report on the TRACKING ISSUE (the gate's trusted
      # number), whatever failed: the agent job, a missing or refused
      # artifact, the push, the PR, a lost post, or the manifest's own error
      # (the land composite fails the run for that after everything else
      # landed), or the label step above. The composite reports on the PR once
      # one exists and knows nothing about the labels, so the recovery steps
      # live here and say which labels actually landed: the label step is one
      # mutation, so either every label it planned is on the issue or none is.
      # Nothing from the agent job but its one-of-two `defer` value reaches
      # this body, and only as a branch condition.
      - name: Report the failure on the tracking issue
        if: always() && steps.mint.outcome == 'success' && (steps.land.outcome != 'success' || steps.labels.outcome != 'success')
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.triage-gate.outputs.issue_number }}
          AGENT_RESULT: ${{ needs.triage-agent.result }}
          LAND_OUTCOME: ${{ steps.land.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          PR_NUMBER: ${{ steps.land.outputs.pr_number }}
          DEFER: ${{ needs.triage-agent.outputs.defer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          pr=""
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] && pr=" Pull request #$PR_NUMBER was opened before the failure."
          case "$LABELS_OUTCOME" in
            success)
              tail="${pr# } This issue was marked triaged; check the PR and the run log." ;;
            failure)
              tail="The triage labels could NOT be applied, so this issue carries neither \`triaged\` nor \`hold:release\` from this run.$pr"
              if [ -n "$pr" ]; then
                tail="$tail Add \`triaged\` by hand, or the next scheduled canary failure opens a duplicate PR."
              else
                tail="$tail The next scheduled canary failure will re-triage it; to keep this run's result instead, add \`triaged\` by hand."
              fi
              if [ "$DEFER" = "true" ]; then
                tail="$tail The agent deferred this to the next inspect-ai release: add \`hold:release\` by hand too, or close-on-green closes this issue on the next green run."
              fi ;;
            *)
              tail="This issue was left untriaged, so the next scheduled canary failure will re-triage it automatically; or re-trigger now via workflow_dispatch on this workflow with the failed run id." ;;
          esac
          body=$(printf '⚠️ The canary triage run did not complete (agent job: %s; landing: %s; labels: %s). Details: %s\n\n%s\n' \
            "$AGENT_RESULT" "$LAND_OUTCOME" "$LABELS_OUTCOME" "$RUN_URL" "$tail")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body" \
            || echo "::error::Could not post the failure report on #$ISSUE."

  # Close the tracking issue when the canary is green again (see the header
  # comment for why green — not a fix PR's `Fixes #<n>` link — is the
  # authoritative close signal). Only for scheduled successes; the serialized
  # concurrency group ensures this never races a triage run on the same issue.
  close-on-green:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      # Comment and close as meridian-marvin[bot], matching the gate's posts;
      # github.token does the same job where the app secrets are absent.
      - name: Mint app token
        id: mint
        if: env.MARVIN_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_flow
          permission-issues: write

      - name: Close the tracking issue if the canary is green again
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token || github.token }}
        run: |
          set -uo pipefail
          # Fail loudly on a query error so a missed close is visible rather
          # than silently indistinguishable from "no open issue" (as triage-gate
          # does for gh issue create). Fetch labels too so we can skip holds.
          if ! open=$(gh issue list --repo "$REPO" --state open \
            --label inspect-ai-main --limit 1 --json url,labels); then
            echo "::error::gh issue list failed — cannot determine whether to close."
            exit 1
          fi
          url=$(echo "$open" | jq -r '.[0].url // empty')
          if [ -z "$url" ]; then
            echo "No open canary issue — nothing to close."
            exit 0
          fi
          # A hold:release issue is deliberately deferred to the next inspect-ai
          # release; in-flux upstream changes flap green, so leave it open and
          # keep its deferred thread intact.
          if echo "$open" | jq -e '.[0].labels | map(.name) | index("hold:release")' >/dev/null; then
            echo "Open issue $url carries hold:release — leaving it open."
            exit 0
          fi
          gh issue comment "$url" --repo "$REPO" \
            --body "$(printf '✅ Canary green again on %s — flow is no longer broken against inspect-ai main. Closing; the next red run opens a fresh issue.' "$RUN_URL")"
          gh issue close "$url" --repo "$REPO" --reason completed
