# Weekly check for new inspect-ai features to surface in flow (issue #766).
#
# Three jobs, split so that no job that runs the agent holds a write
# credential (credential separation, Phase 2; the landing shape is
# meridianlabs-ai/agents design/architecture.md → "Landing job"):
#
#   gate  (trusted)   read the last-reconciled inspect-ai version from
#                     [tool.inspect_flow] in pyproject.toml, compare against
#                     the latest PyPI release, dedup against existing
#                     `inspect-update` issues/PRs — no-op if the latest release
#                     is already handled. Only when there is genuinely new work:
#                     mint a one-hour GitHub App token (issues + org projects)
#                     and open ONE issue for the release, assigned and on the
#                     Atlas board, so its number is known before any untrusted
#                     content is read.
#   agent (untrusted) checkout + project venv, then the dev agent
#                     (claude-code-action, headless) with the job token ONLY
#                     (contents: read, no gh writes, no push): it reads the
#                     aggregated CHANGELOG entries, maps them to flow surfaces,
#                     commits the flow changes locally, and writes the issue
#                     comment and PR text as files. `emit-landing` packages the
#                     commits and a manifest describing what to post.
#   land  (trusted)   a fresh runner that checks out nothing: mints an App
#                     token for this repo (contents + pull requests + issues)
#                     and routes the commits. When they change a path the
#                     shared land action refuses to push (build and dependency
#                     configuration such as pyproject.toml and uv.lock — which
#                     the marker advance and the lock upgrade always change —
#                     workflows, agent instructions), they are a MAINTAINER
#                     HANDOFF: kept as the `inspect-update-handoff-<attempt>`
#                     artifact,
#                     described on the release issue for ransomr to inspect
#                     and apply from his own worktree, and the issue is
#                     labelled `maintainer-handoff`. None of the commits is
#                     pushed: the run opens a DRAFT PR (`Fixes #<issue>`, so
#                     it is his on the Orca board) whose branch holds only a
#                     placeholder note, and he adds the reviewed commits to it.
#                     Otherwise land validates the manifest, pushes the branch
#                     and opens the `inspect-update` PR whose body says
#                     `Fixes #<issue>`. Either way it posts the agent's mapping
#                     on the issue and reports any agent error there.
#
# The App token (meridian-marvin[bot]) is what makes an automated PR trigger
# CI: a GITHUB_TOKEN-authored PR is silently dropped by GitHub's Actions
# recursion guard. Such a PR is assigned to ransomr and waits for his review
# like any other; it gets no `auto` label (the Orca review workflow replaced
# that loop). A scheduled job also cannot summon the agent via @auto (the
# kickoff gates reject machine/bot actors), which is why claude-code-action is
# invoked directly here: the workflow is the trigger and passes the prompt.
#
# Partial-failure mode: the issue is opened BEFORE the agent runs, so a run
# that fails afterwards (a model API error, no commits, a refused manifest)
# leaves an `inspect-update` issue whose title names the release, and the
# dedup below treats that release as claimed — open or closed — until the
# issue is retitled or deleted. The land job says so in its error report on
# that issue, which is assigned to ransomr. A handoff is not a failure: the
# release stays claimed by the title, and while the labelled issue is open
# the gate starts no newer release (its changelog range would contain this
# one, and the marker on main has not advanced); the maintainer's PR closes
# the issue with its `Fixes` line. A failed draft PR is reported on the issue
# with its recovery (a re-run adopts the branch and PR rather than repeating
# them).

name: Inspect Update

on:
  schedule:
    # Mondays 18:00 UTC = 2 PM EDT / 1 PM EST (GitHub cron is UTC-only and
    # does not observe DST). The version dedup below makes any extra or
    # manually-dispatched run harmless.
    - cron: "0 18 * * 1"
  workflow_dispatch:

concurrency:
  group: inspect-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      latest: ${{ steps.versions.outputs.latest }}
      reconciled: ${{ steps.versions.outputs.reconciled }}
      issue: ${{ steps.issue.outputs.number }}
      # The release branch lives under the issue's own namespace
      # (`inspect-update/<issue>/`, delimiter-terminated), which is what the
      # land job pins the manifest's branch to: a prefix of the bare version
      # (`inspect-update/0.3.1`) would also match `inspect-update/0.3.10`, and a
      # tampered artifact could steer the push at another release's branch.
      branch: inspect-update/${{ steps.issue.outputs.number }}/${{ steps.versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Read latest and last-reconciled inspect-ai versions
        id: versions
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://pypi.org/pypi/inspect-ai/json | jq -r .info.version)
          reconciled=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['inspect_flow']['inspect-reconciled-version'])")
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          echo "reconciled=$reconciled" >>"$GITHUB_OUTPUT"
          echo "Latest inspect-ai release: $latest; last reconciled: $reconciled"

      - name: Dedup before doing any work
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          RECONCILED: ${{ steps.versions.outputs.reconciled }}
        run: |
          set -euo pipefail
          if [ "$LATEST" = "$RECONCILED" ] || \
             [ "$(printf '%s\n' "$RECONCILED" "$LATEST" | sort -V | tail -n 1)" = "$RECONCILED" ]; then
            echo "Already reconciled up to $RECONCILED; nothing to do."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Both checks read the list endpoints, never the search API: under
          # the job token a search returns different results than it does for
          # a user (2026-09-21, runs 35611948106 and 35614947712: an open
          # labelled *issue* was counted by `is:pull-request is:open`, and the
          # gate refused until it was closed), and the search index lags the
          # repository besides. `--paginate` emits one JSON array per page;
          # `jq -s 'add'` joins them. A failed call fails the step (pipefail).
          #
          # Any still-open inspect-update PR (regardless of version) means a
          # prior release is mid-reconciliation and hasn't advanced the marker
          # on main yet. Proceeding now would open a second PR whose changelog
          # range is a superset of the first, both racing to edit the same
          # marker line — so wait for it to land first.
          open_prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate \
            | jq -s 'add | map(select(any(.labels[]; .name == "inspect-update"))) | length')
          if [ "$open_prs" -gt 0 ]; then
            echo "An inspect-update PR is still open; waiting for it to land before starting $LATEST."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # The same holds for a release handed to the maintainer (the land
          # job labels its issue `maintainer-handoff`): until the maintainer's
          # PR closes that issue, the marker on main has not advanced.
          handoffs=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=inspect-update,maintainer-handoff&per_page=100" --paginate \
            | jq -s 'add | map(select(has("pull_request") | not)) | length')
          if [ "$handoffs" -gt 0 ]; then
            echo "An inspect-update maintainer handoff is still open; waiting for its PR to land before starting $LATEST."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Keyed on the inspect-update label + version in the title, open or
          # closed, so a release that was already processed (or explicitly
          # closed as won't-do) is never re-opened. The issues endpoint lists
          # PRs too. The version has to match as a whole token (0.3.266 is not
          # 0.3.2660), with its dots taken literally.
          count=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&labels=inspect-update&per_page=100" --paginate \
            | jq -s --arg v "$LATEST" 'add
                | map(select(.title | test("(^|[^0-9.])" + ($v | gsub("\\."; "\\.")) + "([^0-9.]|$)")))
                | length')
          if [ "$count" -gt 0 ]; then
            echo "Found $count existing inspect-update issue(s)/PR(s) for $LATEST; nothing to do."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          else
            echo "inspect-ai $LATEST is unprocessed; proceeding."
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi

      # One-hour installation token scoped to this repo and to what this job
      # writes: the label and the issue (issues) and the Atlas board (org
      # projects). Revoked by the action's post step at job end. `schedule`
      # events carry no `repository` payload, so the repo is named literally.
      - name: Mint the App token
        id: mint
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` takes the App ID or the Client ID; the action has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_flow
          permission-issues: write
          permission-organization-projects: write

      # The label keys the dedup above and opts future searches in; create it
      # before the issue below and the PR label in `land` need it. Idempotent.
      - name: Ensure inspect-update label exists
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          gh label create inspect-update --repo "$GITHUB_REPOSITORY" \
            --description "Automated inspect-ai release reconciliation" \
            --color 1D76DB || true

      # The release's issue, opened deterministically so its number is known
      # to the agent job (for the comment) and the land job (for `Fixes #`
      # and the error report) before any untrusted content is read. The
      # agent's changelog mapping arrives later as a comment, posted by the
      # land job. Assignee and board add are repo defaults (track the issue,
      # link the PR); the board add is best-effort.
      - name: Open the release issue
        id: issue
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          LATEST: ${{ steps.versions.outputs.latest }}
          RECONCILED: ${{ steps.versions.outputs.reconciled }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT: PVT_kwDOC7YMCM4BU68p
        run: |
          set -euo pipefail
          body=$(printf 'Weekly inspect-ai reconciliation (#766) for the releases after %s up to and including %s.\n\nThe reconciliation agent maps the new changelog entries to flow surfaces in a comment below. Automation never pushes commits that change build or dependency configuration, and advancing the reconciled marker and upgrading the lock always do: such commits are handed to the maintainer here for review, with a draft pull request that links here with a Fixes line and holds only a placeholder until the maintainer adds them.\n\nThis issue was opened by the [workflow run](%s) before the agent ran, so the release counts as claimed by the weekly dedup, open or closed, until this issue is retitled or deleted.\n' \
            "$RECONCILED" "$LATEST" "$RUN_URL")
          url=$(gh issue create --repo "$REPO" \
            --title "inspect-ai $LATEST: surface new features in flow" \
            --label inspect-update --assignee ransomr --body "$body")
          number="${url##*/}"
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::gh issue create returned '$url'."; exit 1; }
          echo "number=$number" >>"$GITHUB_OUTPUT"
          echo "Opened issue #$number for inspect-ai $LATEST ($url)."
          # Best-effort from here: the issue exists and its number is out, so
          # nothing below may fail the gate (that would skip the agent and the
          # land job while the issue already claims the release).
          node=$(gh api "repos/$REPO/issues/$number" --jq '.node_id' 2>/dev/null || true)
          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
          if [ -n "$node" ] && gh api graphql \
               -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
               -f p="$PROJECT" -f c="$node" --silent; then
            echo "Added #$number to the Atlas board."
          else
            echo "::warning::Could not add #$number to the Atlas board."
          fi

  agent:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Agent runs restore caches, never save them (meridianlabs-ai/agents: design/agent-cache-scope.md).
    cache-mode: read
    # Job token only, and read-only: this job references no secret. The agent
    # ingests the upstream CHANGELOG and runs uv/python on the checkout, so
    # nothing it can reach may write to GitHub; every write happens in `land`
    # from the validated manifest. id-token is the Anthropic WIF OIDC exchange.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: meridianlabs-ai/agents/.github/actions/assert-no-persisted-credential@main

      # The branch the land job pushes to (its name is pinned there by
      # `branch-prefix`), and the SHA the landing manifest is anchored to:
      # commits above it are the run's landable work.
      - name: Start the release branch
        id: base
        env:
          BRANCH: ${{ needs.gate.outputs.branch }}
          OUT: ${{ runner.temp }}/agent-out
        run: |
          set -euo pipefail
          git checkout --quiet -b "$BRANCH"
          mkdir -p "$OUT"
          sha=$(git rev-parse HEAD)
          [ "$sha" = "$GITHUB_SHA" ] \
            || { echo "::error::The release branch starts at $sha, but the land job pins the run's start to github.sha ($GITHUB_SHA); the checkout must be at github.sha."; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Same convention the reusable dev-agent workflow uses: provision the
      # project venv so the agent can run pytest/ruff/pyright and introspect
      # installed inspect_ai signatures.
      - name: Provision project environment
        uses: ./.github/actions/claude-setup

      # Direct (headless) invocation, mirroring the dev-agent invocation in
      # meridianlabs-ai/agents/.github/workflows/claude.yml. The anthropic_*
      # values are Workload Identity Federation identifiers, not secrets. The
      # settings allow-list is the dev agent's minus `git push`, extended with
      # a WebFetch rule scoped to raw.githubusercontent.com for the CHANGELOG.
      # The job token is passed explicitly so the action does not mint its own
      # App token: `gh` here can read (the canonical PR diff) and nothing else.
      # Commits carry the App's bot identity, since the App token pushes them.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GIT_AUTHOR_NAME: meridian-marvin[bot]
          GIT_AUTHOR_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: meridian-marvin[bot]
          GIT_COMMITTER_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
        with:
          anthropic_federation_rule_id: fdrl_01GpNgJm9jE6ZfvcqoJYQL2Y
          anthropic_organization_id: be5d0086-bc43-45d2-9184-20ecdd647aa7
          anthropic_service_account_id: svac_01RL4wYD7ikbypwYKf4wFojv
          anthropic_workspace_id: wrkspc_01RKCQ5DTPBatQ7kHLkaEueD
          github_token: ${{ github.token }}
          settings: >-
            {"permissions":{"allow":["Read","Edit","Write",
            "WebFetch(domain:raw.githubusercontent.com)",
            "Bash(pytest:*)","Bash(ruff:*)","Bash(mypy:*)","Bash(pyright:*)","Bash(pip:*)",
            "Bash(pip3:*)","Bash(uv:*)","Bash(python:*)","Bash(python3:*)",
            "Bash(gh:*)",
            "Bash(git fetch:*)","Bash(git merge:*)","Bash(git rebase:*)",
            "Bash(git checkout:*)","Bash(git switch:*)",
            "Bash(git branch:*)","Bash(git status:*)","Bash(git log:*)",
            "Bash(git diff:*)","Bash(git show:*)","Bash(git rev-parse:*)",
            "Bash(git remote:*)",
            "Bash(git add:*)","Bash(git commit:*)","Bash(git config:*)"]}}
          claude_args: >-
            --model opus
            --fallback-model default
            --add-dir ${{ runner.temp }}/agent-out
          prompt: |
            You are the weekly inspect-ai reconciliation agent for inspect_flow
            (automates issue #766). inspect-ai releases newer than
            ${{ needs.gate.outputs.reconciled }} (the last reconciled version)
            up to ${{ needs.gate.outputs.latest }} (the latest release) have
            not been checked for new features that flow should surface.

            Your GitHub token is read-only: `gh` works for reads, but you
            cannot push, open a PR, comment or label, and must not try. Your
            work lands after this job ends: a trusted job pushes the commits
            you make on the current branch
            (${{ needs.gate.outputs.branch }}, already checked out) and opens
            the PR, and posts the files you write under
            ${{ runner.temp }}/agent-out (call it OUT below). Issue
            #${{ needs.gate.outputs.issue }} already exists for this release;
            your mapping is posted there as a comment. Commits that change
            build or dependency configuration (pyproject.toml, uv.lock — the
            marker advance and the lock upgrade below always do) are never
            pushed by automation: the trusted job hands them to the
            maintainer on that issue instead of opening the PR, and the
            maintainer opens it with your PR text. Commit them and write
            every file below exactly as described all the same.

            Read AGENTS.md first and follow it throughout.

            1. Fetch the inspect_ai changelog at the release tag using WebFetch:
               https://raw.githubusercontent.com/UKGovernmentBEIS/inspect_ai/v${{ needs.gate.outputs.latest }}/CHANGELOG.md
               and aggregate the entries for every version newer than
               ${{ needs.gate.outputs.reconciled }} up to and including
               ${{ needs.gate.outputs.latest }}.

            2. Map those entries to flow surfaces. The types in
               src/inspect_flow/_types (FlowTask, FlowOptions, FlowModel, ...)
               mirror inspect_ai's Task / task_with / eval_set signatures;
               cross-check the changelog against the installed inspect_ai
               package by introspecting those signatures (the project venv is
               on PATH). PR #764 (turn_limit / score_on_error / checkpoint) is
               the canonical example of this kind of change — run
               `gh pr diff 764` to see the expected shape, including how
               generated types are handled.

            3. Write the mapping to OUT/issue-comment.md (Markdown; it is
               posted as a comment on issue #${{ needs.gate.outputs.issue }}):
               each new inspect feature, the flow surface it maps to
               (FlowTask, FlowOptions, FlowModel, ...), or why it is not
               applicable to flow. @mention @ransomr inline wherever a
               mapping is ambiguous or needs a human decision.

            4. On the current branch, implement the best-effort flow changes
               and commit them (never push, never switch branches). Write
               OUT/pr-title.txt and OUT/pr-body.md (step 5) BEFORE your first
               commit attempt, so a refused commit still leaves a legible
               landing directory; revise them afterwards if the work changes.
               Commit with exactly this shape, which is what the tool
               allow-list matches: `git add -A` (or `git add <paths>`) as one
               Bash command, then `git commit -m "<one-line message>"` as a
               separate Bash command. No heredoc message, no `$(...)`, no
               `&&`-chained commands, no `cd`. A refused command fails
               silently in this environment (nobody is there to approve it):
               if the same command is refused twice, stop retrying and write
               what was refused into OUT/issue-comment.md instead of
               summarising the work as done.
               - Advance the reconciled marker in pyproject.toml:
                 [tool.inspect_flow] inspect-reconciled-version = "${{ needs.gate.outputs.latest }}"
               - Upgrade all locked dependencies (`uv lock --upgrade` then
                 `uv sync`) so the pinned CI checks run against the reconciled
                 inspect-ai release and the latest of everything else, rather
                 than stale pins. Do NOT raise the `inspect-ai>=` dependency
                 floor unless flow would be completely broken on older
                 versions.
               - Regenerate the generated types after the upgrade
                 (`python src/inspect_flow/_types/type_gen.py`) and commit any
                 changes. type_gen copies inspect-ai's type/docstring surface
                 verbatim, so even a docstring-only upstream change makes
                 generated.py stale; the check-type-gen CI job regenerates
                 against the locked inspect-ai and fails if it differs.
               - Verify with `ruff format`, `ruff check --fix`, `pyright`, and
                 the relevant tests before committing.
               - If the full upgrade cannot produce a green build because a
                 dependency has not caught up to the reconciled release (e.g.
                 inspect-scout still imports a symbol inspect-ai renamed), do
                 NOT commit a broken lock. Hold the offending package(s) back at
                 their last working version by adding a temporary
                 `constraint-dependencies` entry under `[tool.uv]` in
                 pyproject.toml and re-locking (prefer this over an upper bound
                 in `[project] dependencies`, which would ship in the published
                 wheel's metadata and constrain downstream installs). If no
                 released version of the lagging dependency works with the
                 reconciled inspect-ai at all (every release still imports the
                 renamed symbol), the only green lock is one that also keeps
                 inspect-ai itself at its previously locked version — do that as
                 the last resort rather than chasing an unsatisfiable "upgrade
                 inspect-ai AND stay green". Either way, still advance the
                 reconciled marker (it is independent of the locked version) and
                 call out the blocking dependency in OUT/issue-comment.md with
                 @ransomr so it can be picked up once the dependency releases a
                 fix.

            5. Describe the PR:
               - OUT/pr-title.txt: one line, a conventional-commit title (per
                 AGENTS.md) containing "inspect-ai ${{ needs.gate.outputs.latest }}".
               - OUT/pr-body.md: what changed and why. The
                 "Fixes #${{ needs.gate.outputs.issue }}" line is added for
                 you; do not write it.

            6. If no changelog entry maps to a flow change, still commit the
               marker advance (chore: title) and say in OUT/issue-comment.md
               that no flow changes were needed.

            If you cannot complete the task, say what blocked you in
            OUT/issue-comment.md.

      # Served-model table, cost, duration and turn count to the job summary
      # (no transcript is uploaded as an artifact). Its fallback/refusal note,
      # if any, travels to the land job as the manifest's
      # provenance_comment_file. Best-effort, always exits 0.
      - name: Model provenance
        id: provenance
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/model-provenance@main
        with:
          exec-file: ${{ steps.claude.outputs.execution_file }}
          requested: opus

      # Surface agent errors the action swallows. A model API error (overload /
      # 529, a model 404, etc.) leaves the run green at the workflow level but
      # with no result. Refused tool calls are the other silent failure: in an
      # unattended run a call the allow-list rejects fails back to the model,
      # which may give up and summarise as if done (run 35446410455: 11
      # denials, no commits, `is_error` false). The result record's
      # `permission_denials` carries each refused tool's input; denials with
      # no commit are an error naming them, denials with commits a warning
      # (work may still have been lost) on the issue comment. This job cannot
      # post: the message becomes the manifest's `error` (fail_run true) and
      # the land job posts it on the release issue and fails the run after
      # everything else landed. Exits 0 on every path: the red X is the land
      # job's.
      - name: Surface agent errors
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          START: ${{ steps.base.outputs.sha }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          WARN_FILE: ${{ runner.temp }}/agent-warning.md
        run: |
          set -uo pipefail
          file="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          err=""
          denials=0
          refused=""
          if [ -f "$file" ]; then
            msgs='(if type=="array" then . else .messages end)'
            err=$(jq -r "$msgs"' | map(select(.type=="result" and .is_error==true)) | last | .result // empty' "$file" 2>/dev/null || true)
            result="$msgs"' | map(select(.type=="result")) | last // {}'
            denials=$(jq -r "$result"' | .permission_denials_count // (.permission_denials | length) // 0' "$file" 2>/dev/null || echo 0)
            refused=$(jq -r "$result"' | (.permission_denials // [])[:10][] | "\(.tool_name // "?"): \(((.tool_input // {}) | (.command? // tojson)) | tostring | gsub("\\s+"; " ") | .[:200])"' "$file" 2>/dev/null | sed 's/^/    /' || true)
          fi
          if [ -z "$err" ] && [ "$CLAUDE_OUTCOME" != "success" ]; then
            err="the Claude Code step ended with outcome '$CLAUDE_OUTCOME' before producing a result (see the job logs)."
          fi
          if [ -n "$err" ]; then
            echo "::error::Claude run did not complete: $err"
            printf 'The reconciliation agent errored before finishing:\n\n> %s\n\nUsually transient (model API capacity/overload or a model-availability blip); if it persists see https://status.claude.com.\n' "$err" >"$ERROR_FILE"
          fi
          if [ "$denials" -gt 0 ] 2>/dev/null; then
            tip=$(git rev-parse HEAD 2>/dev/null || echo "$START")
            note="$denials tool call(s) were refused by the permission allow-list. A refused call fails back to the model with nobody to approve it, so work may have been lost. Refused (first 10, one line each):"
            if [ -n "$START" ] && [ "$tip" != "$START" ]; then
              echo "::warning::$note"
              printf '%s\n' "$refused"
              printf '⚠️ %s\n\n%s\n' "$note" "$refused" >"$WARN_FILE"
            else
              echo "::error::No commit landed and $note"
              printf '%s\n' "$refused"
              printf 'No commit landed and %s\n\n%s\n' "$note" "$refused" >>"$ERROR_FILE"
            fi
          fi
          [ -s "$ERROR_FILE" ] || echo "No agent error detected."

      # Everything the land job pushes and posts, as ONE JSON object for
      # emit-landing's manifest-extra (schema: agents
      # .github/actions/emit-landing/README.md). The agent's files are DATA:
      # they are copied (capped under the validator's 64 KiB file limit) and
      # referenced by name, never interpolated into a command. Fields:
      #   pr        — open the PR for the branch when HEAD moved past the start
      #               SHA; title from OUT/pr-title.txt (first line, control
      #               characters stripped, forced to name the release since the
      #               dedup keys on it), body = "Fixes #<issue>" + OUT/pr-body.md,
      #               label inspect-update, issue for the "Opened" link; the
      #               land job drops it when the commits are a maintainer
      #               handoff
      #   comments  — the Surface step's denial warning, if any, then
      #               OUT/issue-comment.md, on the release issue
      #   provenance_comment_file — the model-provenance note, if any
      #   error     — the Surface step's message and/or the missing outputs,
      #               fail_run true; posted on the PR (or the issue) by `land`,
      #               whose own failure note on the issue carries the recovery
      #               steps
      - name: Compose landing manifest
        if: always()
        env:
          DIR: ${{ runner.temp }}/landing
          OUT: ${{ runner.temp }}/agent-out
          EXTRA: ${{ runner.temp }}/landing-extra.json
          START: ${{ steps.base.outputs.sha }}
          LATEST: ${{ needs.gate.outputs.latest }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          PROV_NOTE: ${{ steps.provenance.outputs.note }}
          ERROR_FILE: ${{ runner.temp }}/agent-error.md
          WARN_FILE: ${{ runner.temp }}/agent-warning.md
        run: |
          set -euo pipefail
          mkdir -p "$DIR"
          extra='{}'
          err=""
          tip=$(git rev-parse HEAD 2>/dev/null || echo "$START")
          if [ -n "$START" ] && [ "$tip" != "$START" ]; then
            title=$( { head -n1 "$OUT/pr-title.txt" 2>/dev/null || true; } | tr -d '\000-\037\177' | head -c 200)
            [ -n "$title" ] || title="chore: reconcile inspect-ai $LATEST"
            case "$title" in *"inspect-ai $LATEST"*) ;; *) title="$title (inspect-ai $LATEST)" ;; esac
            { printf 'Fixes #%s\n\n' "$ISSUE"; head -c 60000 "$OUT/pr-body.md" 2>/dev/null || true; } >"$DIR/pr-body.md"
            extra=$(jq -c --arg t "$title" --argjson n "$ISSUE" \
              '.pr = {open: true, title: $t, body_file: "pr-body.md", labels: ["inspect-update"], issue: $n}' <<<"$extra")
          else
            err="The agent made no commits, so no branch was pushed and no PR was opened."
          fi
          # The denial warning goes first and the mapping gets the rest of the
          # 60,000 bytes: land posts at most that many, so a warning after a
          # full-size mapping would be cut off.
          comment="$DIR/issue-comment.md"
          [ -s "$WARN_FILE" ] && cat "$WARN_FILE" >"$comment"
          if [ -s "$OUT/issue-comment.md" ]; then
            budget=60000
            if [ -s "$comment" ]; then
              printf '\n\n' >>"$comment"
              budget=$((60000 - $(wc -c <"$comment")))
            fi
            head -c "$budget" "$OUT/issue-comment.md" >>"$comment"
          else
            err="${err:+$err }The agent left no changelog mapping (issue-comment.md)."
          fi
          if [ -s "$comment" ]; then
            extra=$(jq -c --argjson n "$ISSUE" '.comments = [{number: $n, body_file: "issue-comment.md"}]' <<<"$extra")
          fi
          if [ -n "${PROV_NOTE:-}" ]; then
            printf '%s\n' "$PROV_NOTE" >"$DIR/prov.md"
            extra=$(jq -c '.provenance_comment_file = "prov.md"' <<<"$extra")
          fi
          if [ -s "$ERROR_FILE" ]; then
            err=$(printf '%s%s' "$(cat "$ERROR_FILE")" "${err:+$(printf '\n\n%s' "$err")}")
          fi
          if [ -n "$err" ]; then
            msg=$(printf '⚠️ The weekly inspect-update run for inspect-ai %s did not complete.\n\n%s' "$LATEST" "$err")
            extra=$(jq -c --arg msg "$msg" '.error = {message: $msg, fail_run: true}' <<<"$extra")
          fi
          printf '%s\n' "$extra" >"$EXTRA"
          echo "landing: $(jq -c 'if .error then .error.message = "<\(.error.message | length) chars>" else . end' <<<"$extra")"

      # Last, always: package the commits above the start SHA and the manifest
      # for the land job. This action holds no token.
      - name: Emit landing manifest
        if: always()
        uses: meridianlabs-ai/agents/.github/actions/emit-landing@main
        with:
          start-sha: ${{ steps.base.outputs.sha }}
          branch: ${{ needs.gate.outputs.branch }}
          # The SAME value the land job gets: the validator pins the
          # manifest's issue_number to it, and it is where the final report
          # goes when the manifest never validated.
          issue-number: ${{ needs.gate.outputs.issue }}
          manifest-extra: ${{ runner.temp }}/landing-extra.json

  # TRUSTED, last: a fresh runner that checks out nothing and installs
  # nothing. Runs whatever the agent job did (always()), so an agent failure
  # is reported on the release issue instead of dying in the log; skipped when
  # the gate found nothing to do or failed before opening the issue.
  land:
    needs: [gate, agent]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # fetch the start SHA (land's read token)
      actions: read # artifact download
    env:
      # The only file on a handoff's draft PR branch; tests/test_workflows.py
      # fails the required py-test checks while it is in the tree.
      PLACEHOLDER: INSPECT_UPDATE_HANDOFF.md
    steps:
      # Scoped to this repo and to this job's writes: the push (contents), the
      # PR and its labels (pull requests), the issue comment, the "Opened"
      # link and the error report (issues). The push and the PR come from
      # meridian-marvin[bot], so CI and the reviewer trigger as they did for
      # the machine account.
      - name: Mint the App token
        id: mint
        uses: actions/create-github-app-token@v2
        with:
          # `app-id` takes the App ID or the Client ID; the action has no client-id input.
          app-id: ${{ secrets.MARVIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
          owner: meridianlabs-ai
          repositories: inspect_flow
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Route the commits before `land` sees them. The shared land action
      # refuses to push a bundle that changes a path later automated runs
      # execute or load (its lib.sh PROTECTED_PATHSPECS: build and dependency
      # configuration, workflows, agent instructions), and that guard stays
      # the boundary: this step only decides, from the same list, whether the
      # run is a MAINTAINER HANDOFF instead of a push. Reads only: the
      # artifact is data, materialized in an empty bare repo like land's own
      # fetch step (no checkout, no hooks, nothing of it executed). Outputs:
      #   bundle=true   the bundle verified (tip = the manifest's head_sha,
      #                 descending from github.sha): ROUTE/handoff holds it,
      #                 the same commits as changes.patch, and the agent's PR
      #                 title and body, whichever way the run lands
      #   route=handoff it changes a protected path (or the list could not be
      #                 read or walked: fail closed to a human): ROUTE/landing
      #                 is the landing without the commits and the PR, plus
      #                 maintainer-handoff.md composed here from trusted
      #                 values and the bundle's own paths (only names in a
      #                 plain character set are shown; nothing else of the
      #                 agent's text); head=<the verified tip> for the draft PR
      # Anything else — no commits, a start other than github.sha, a bundle
      # that does not verify — leaves both unset, and `land` gets the
      # original landing to refuse or land exactly as before.
      - name: Download the landing artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: landing
          path: ${{ runner.temp }}/route/src

      - name: Route protected changes to the maintainer
        id: route
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          SRC: ${{ runner.temp }}/route/src
          ROUTE: ${{ runner.temp }}/route
          START: ${{ github.sha }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          LATEST: ${{ needs.gate.outputs.latest }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: inspect-update-handoff-${{ github.run_attempt }}
          URL: ${{ github.server_url }}/${{ github.repository }}.git
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: ${{ runner.temp }}/no-hooks
        run: |
          set -euo pipefail
          m="$SRC/manifest.json"
          if [ "$(jq -r --arg s "$START" '.has_bundle == true and .start_sha == $s' "$m")" != true ]; then
            echo "The landing carries no commits from $START; nothing to route."
            exit 0
          fi
          head=$(jq -r '.head_sha' "$m")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::head_sha '$head' is not a SHA; leaving the landing to land."; exit 0; }
          work="$ROUTE/repo"
          rm -rf "$work"
          git init --quiet --bare "$work"
          cd "$work"
          git fetch --quiet --no-tags "$URL" "$START"
          git bundle verify --quiet "$SRC/commits.bundle"
          git fetch --quiet --no-tags "$SRC/commits.bundle" HEAD
          [ "$(git rev-parse FETCH_HEAD)" = "$head" ] || { echo "::warning::The bundle's tip is not head_sha $head; leaving the landing to land."; exit 0; }
          git merge-base --is-ancestor "$START" "$head" || { echo "::warning::$head does not descend from $START; leaving the landing to land."; exit 0; }

          keep="$ROUTE/handoff"
          mkdir -p "$keep"
          cp "$SRC/commits.bundle" "$keep/"
          git format-patch --quiet --stdout "$START..$head" >"$keep/changes.patch"
          if [ "$(jq -r '.pr.open == true' "$m")" = true ]; then
            jq -r '.pr.title // ""' "$m" >"$keep/pr-title.txt"
            [ ! -f "$SRC/pr-body.md" ] || [ -L "$SRC/pr-body.md" ] || cp "$SRC/pr-body.md" "$keep/"
          fi
          echo "bundle=true" >>"$GITHUB_OUTPUT"

          # The same list and link/import walk the land action checks with,
          # from its own copy (downloaded at job setup with the Land step).
          lib="${RUNNER_WORKSPACE%/*}/_actions/meridianlabs-ai/agents/main/.github/actions/land/lib.sh"
          protected_paths() {
            [ -f "$lib" ] || { echo "::warning::The land action's lib.sh is not at $lib." >&2; return 1; }
            # shellcheck source=/dev/null
            . "$lib" || return 1
            local rev p
            local -a reach=()
            for rev in "$START" "$head"; do
              protected_reach "$rev" "${PROTECTED_PATHSPECS[@]}" >"$ROUTE/reach" || return 1
              while IFS= read -r -d '' p; do reach+=(":(literal)$p"); done <"$ROUTE/reach"
            done
            git diff -z --name-only --no-renames "$START" "$head" -- "${PROTECTED_PATHSPECS[@]}" ${reach[@]+"${reach[@]}"}
          }
          if ! protected_paths >"$ROUTE/protected"; then
            echo "::warning::Could not list the protected paths; treating every changed path as protected."
            git diff -z --name-only --no-renames "$START" "$head" >"$ROUTE/protected"
          fi
          if [ ! -s "$ROUTE/protected" ]; then
            echo "No protected path changed between $START and $head; landing as usual."
            exit 0
          fi

          # Paths are agent-chosen: shown only in a plain character set.
          plain() { [[ "$1" =~ ^[A-Za-z0-9._/+-]{1,200}$ ]]; }
          names=""
          odd=0
          # shellcheck disable=SC2016 # Markdown backticks, not expansions
          while IFS= read -r -d '' p; do
            if plain "$p"; then names+=$(printf '%s`%s`' "${names:+, }" "$p"); else odd=$((odd + 1)); fi
          done <"$ROUTE/protected"
          [ "$odd" -eq 0 ] || names+="${names:+, }$odd path(s) with other characters (see the patch)"
          git diff -z --numstat --no-renames "$START" "$head" >"$ROUTE/numstat"
          table=""
          rows=0
          more=0
          # shellcheck disable=SC2016 # Markdown backticks, not expansions
          while IFS= read -r -d '' rec; do
            add="${rec%%$'\t'*}"; rest="${rec#*$'\t'}"; del="${rest%%$'\t'*}"; p="${rest#*$'\t'}"
            if [ "$rows" -ge 50 ] || ! plain "$p"; then more=$((more + 1)); continue; fi
            table+=$(printf '| `%s` | %s | %s |\n' "$p" "$add" "$del")$'\n'
            rows=$((rows + 1))
          done <"$ROUTE/numstat"
          [ "$more" -eq 0 ] || table+="| $more more (see the patch) | | |"$'\n'
          commits=$(git rev-list --count "$START..$head")

          land="$ROUTE/landing"
          mkdir -p "$land"
          find "$SRC" -maxdepth 1 -type f ! -name commits.bundle ! -name manifest.json -exec cp {} "$land/" \;
          dir="/tmp/inspect-update-$ISSUE"
          ref="refs/inspect-update/$ISSUE"
          # shellcheck disable=SC2016 # Markdown and commands for the maintainer, not expansions
          {
            printf '@ransomr: **maintainer review needed.** The reconciliation for inspect-ai %s is ready, but its commits change build or dependency configuration, which automation never pushes: a maintainer reads them before any automated run executes them. Nothing was pushed and no PR was opened. This is the expected path for the weekly marker advance and lock upgrade, not a failed run.\n\n' "$LATEST"
            printf '### What changed\n\n%s commit(s) from `%s` to `%s`. Protected, and the reason this needs you: %s.\n\n' "$commits" "$START" "$head" "$names"
            printf '| File | + | − |\n|---|--:|--:|\n%s\n' "$table"
            printf '### Retrieve\n\nThe `%s` artifact of [run %s](%s), kept for 90 days: `commits.bundle`, the same commits as `changes.patch`, and the agent'"'"'s `pr-title.txt` and `pr-body.md`.\n\n' "$ARTIFACT" "$RUN_ID" "$RUN_URL"
            printf '```sh\ngh run download %s --repo %s --name %s --dir %s\n```\n\n' "$RUN_ID" "$REPO" "$ARTIFACT" "$dir"
            printf '### Inspect and apply\n\nThis run also opens a draft PR from `%s`, labelled `inspect-update` and linked here with `Fixes #%s`. Its branch holds only a placeholder, `%s`, and none of these commits. On that branch, in a worktree of %s that you control, before running anything from these commits:\n\n' "$BRANCH" "$ISSUE" "$PLACEHOLDER" "$REPO"
            printf '```sh\ngit fetch origin\ngit bundle verify %s/commits.bundle\ngit fetch %s/commits.bundle HEAD:%s\ntest "$(git rev-parse %s)" = %s\ngit log --stat -p %s..%s\ngit switch %s\ngit merge --no-edit %s\ngit rm -q %s\ngit commit -q -m "chore: remove the maintainer handoff placeholder"\ngit merge --no-edit origin/main\n```\n\n' \
              "$dir" "$dir" "$ref" "$ref" "$head" "$START" "$ref" "$BRANCH" "$ref" "$PLACEHOLDER"
            printf 'Read every line: the lock decides what `uv sync` installs, and pyproject.toml what the build runs. If the merge of `origin/main` conflicts on `uv.lock`, re-run `uv lock --upgrade` rather than merging it by hand.\n\n'
            printf '### Tests and review\n\n`uv sync --frozen`, `make check`, `pytest`, and `python src/inspect_flow/_types/type_gen.py` leaving no diff (the check-type-gen CI job), then review it as you would any lock upgrade.\n\n'
            printf '### PR\n\nPush the branch once the tests pass, retitle the draft PR and replace its body with the agent'"'"'s `pr-title.txt` and `pr-body.md` (keep `Fixes #%s`, so merging it closes this issue), then mark it ready. The placeholder fails the required `py-test` checks until it is deleted. If this run reports that the draft PR was not opened, follow the recovery it gives. Until this issue is closed it carries the `maintainer-handoff` label and the weekly run starts no newer release; inspect-ai %s stays claimed by this issue'"'"'s title either way.\n' "$ISSUE" "$LATEST"
          } >"$land/maintainer-handoff.md"
          jq --argjson n "$ISSUE" 'del(.pr) | .has_bundle = false | .head_sha = .start_sha
            | .comments = ((.comments // []) + [{number: $n, body_file: "maintainer-handoff.md"}])' "$m" >"$land/manifest.json"
          echo "route=handoff" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"
          echo "Maintainer handoff: $commits commit(s) change protected paths; land gets the landing without them."

      # Kept for the maintainer, whichever way the run lands: the handoff
      # comment points here, and a failure report names it when the push or
      # anything after it failed. Named per attempt and never overwritten:
      # upload-artifact's overwrite deletes the old artifact before the new
      # upload, so a re-run of this job would put the archive an earlier
      # attempt's comment points to at risk.
      - name: Keep the commits for the maintainer
        id: keep
        if: steps.route.outputs.bundle == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: inspect-update-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route/handoff
          retention-days: 90
          if-no-files-found: error

      # Only once the commits are kept: the handoff then goes to `land` as
      # this artifact, which it validates like any landing (nothing to push,
      # no PR; the agent's comments, the handoff comment, provenance and any
      # error are posted on the release issue).
      - name: Stage the landing without the protected commits
        id: stage
        if: steps.route.outputs.route == 'handoff' && steps.keep.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: landing-handoff-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route/landing
          retention-days: 1
          if-no-files-found: error

      - name: Land
        id: land
        uses: meridianlabs-ai/agents/.github/actions/land@main
        with:
          token: ${{ steps.mint.outputs.token }}
          # The manifest creates no issues (the gate opened the release's).
          allowed-issue-repos: ""
          # The same value emit-landing got above (a gate output, computed
          # before any untrusted code ran): the validator pins the manifest's
          # issue_number to it, and it is the trusted target for the final
          # report when the manifest never validated.
          issue-number: ${{ needs.gate.outputs.issue }}
          # No PR names a head ref to pin the branch to, so the release
          # issue's namespace (see the gate's `branch` output) is the pin: the
          # manifest's branch must start with `inspect-update/<issue>/`, and
          # the trailing delimiter keeps another issue's branches out of it.
          branch-prefix: inspect-update/${{ needs.gate.outputs.issue }}/
          # A maintainer handoff lands the staged copy (see Route above).
          artifact-name: ${{ steps.stage.outcome == 'success' && format('landing-handoff-{0}', github.run_attempt) || 'landing' }}
          # The run's start as trusted context records it: github.sha comes
          # from the event payload, and the agent job's `base` step fails
          # unless its checkout is at exactly this commit. The validator
          # refuses a manifest that carries commits unless its start_sha
          # equals this, so the agent job cannot name another start and land
          # history the run never began from (agents#137, finding 4628444).
          start-sha: ${{ github.sha }}
          # The labels the agent job's composer puts on the PR, pinned so a
          # manifest rewritten after it cannot add others (agents#132).
          allowed-pr-labels: '["inspect-update"]'

      # The handoff's hold on newer releases (the gate's dedup waits while an
      # open inspect-update issue carries this label). After Land, whatever
      # it did: the commits are kept and the release is the maintainer's
      # either way. A failure here fails the run and is reported on the issue.
      - name: Hold newer releases for the maintainer
        id: hold
        if: always() && steps.stage.outcome == 'success' && steps.mint.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          gh label create maintainer-handoff --repo "$REPO" \
            --description "inspect-update commits waiting for the maintainer's PR" \
            --color D93F0B || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label maintainer-handoff \
            || { echo "::error::Could not label #$ISSUE maintainer-handoff; add the label by hand so the weekly run waits for the handoff."; exit 1; }

      # The handoff as a DRAFT PR, so it shows on the maintainer's Orca board
      # (an App-authored PR whose `Fixes` issue is assigned to ransomr is
      # his). A PR needs a branch diff and automation never pushes the kept
      # commits, so the branch is ONE commit on github.sha adding
      # $PLACEHOLDER, a note composed here from trusted values only, in a
      # fresh bare repo that never fetched the bundle: none of the agent's
      # objects can reach the push. The maintainer adds the reviewed commits
      # and deletes the note; until then the PR is a draft and the
      # placeholder test fails the required py-test checks. Idempotent for a
      # re-run: a PR from the branch, in any state, is adopted rather than
      # duplicated (labelled and assigned again while open), and an existing
      # branch is never pushed to.
      - name: Open the maintainer's draft PR
        id: draft
        if: always() && steps.stage.outcome == 'success' && steps.mint.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          LATEST: ${{ needs.gate.outputs.latest }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          START: ${{ github.sha }}
          HEAD: ${{ steps.route.outputs.head }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: inspect-update-handoff-${{ github.run_attempt }}
          WORK: ${{ runner.temp }}/draft
          URL: ${{ github.server_url }}/${{ github.repository }}.git
          GIT_AUTHOR_NAME: meridian-marvin[bot]
          GIT_AUTHOR_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: meridian-marvin[bot]
          GIT_COMMITTER_EMAIL: 330132053+meridian-marvin[bot]@users.noreply.github.com
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TOKEN: ${{ steps.mint.outputs.token }}
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.${{ github.server_url }}.helper
          GIT_CONFIG_VALUE_1: '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
          GIT_CONFIG_KEY_2: core.hooksPath
          GIT_CONFIG_VALUE_2: ${{ runner.temp }}/no-hooks
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ && "$HEAD" =~ ^[0-9a-f]{40}$ && "$START" =~ ^[0-9a-f]{40}$ && "$LATEST" =~ ^[0-9A-Za-z.+-]+$ && "$BRANCH" == "inspect-update/$ISSUE/$LATEST" ]] \
            || { echo "::error::Refusing to compose the draft PR from unexpected values (issue '$ISSUE', head '$HEAD', release '$LATEST')."; exit 1; }
          title="chore: reconcile inspect-ai $LATEST (maintainer handoff)"
          prs=$(gh api "repos/$REPO/pulls?state=all&head=${REPO%%/*}:$BRANCH&per_page=100" --paginate \
            | jq -s 'add | sort_by(.state != "open")')
          pr=$(jq -r '.[0].html_url // empty' <<<"$prs")
          state=$(jq -r '.[0].state // empty' <<<"$prs")
          if [ -n "$pr" ]; then
            echo "Adopting $pr ($state) for $BRANCH; nothing pushed, no PR opened."
          else
            rc=0
            git ls-remote --exit-code --heads "$URL" "refs/heads/$BRANCH" >/dev/null || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Adopting the branch $BRANCH already on origin; nothing pushed."
            elif [ "$rc" -eq 2 ]; then
              rm -rf "$WORK"
              git init --quiet --bare "$WORK"
              cd "$WORK"
              git fetch --quiet --no-tags "$URL" "$START"
              # shellcheck disable=SC2016 # Markdown backticks, not expansions
              blob=$(printf '# Maintainer handoff: inspect-ai %s\n\nA placeholder, so that the draft PR for #%s has a diff. **Delete this file before merging**: while it is in the tree, `tests/test_workflows.py` fails the required `py-test` checks.\n\nThe reconciliation'"'"'s commits, `%s..%s`, are not on this branch: they change build or dependency configuration, which automation never pushes. They are kept for 90 days as the `%s` artifact of [run %s](%s). Review them and add them to this branch from a worktree you control, as the handoff comment on #%s describes.\n' \
                "$LATEST" "$ISSUE" "$START" "$HEAD" "$ARTIFACT" "$RUN_ID" "$RUN_URL" "$ISSUE" | git hash-object -w --stdin)
              export GIT_INDEX_FILE="$WORK/placeholder-index"
              git read-tree "$START"
              git update-index --add --cacheinfo "100644,$blob,$PLACEHOLDER"
              commit=$(git commit-tree "$(git write-tree)" -p "$START" -m "chore: placeholder for the inspect-ai $LATEST maintainer handoff (#$ISSUE)")
              git push --quiet "$URL" "$commit:refs/heads/$BRANCH"
              echo "Pushed $BRANCH: $START plus $PLACEHOLDER only."
            else
              echo "::error::Could not read whether $BRANCH is on origin (git ls-remote exit $rc)."
              exit 1
            fi
            # shellcheck disable=SC2016 # Markdown backticks, not expansions
            printf 'Fixes #%s\n\n**Maintainer handoff, not mergeable as is.** This branch holds only `%s`, a placeholder: the reconciliation'"'"'s commits change build or dependency configuration, which automation never pushes. They are kept for 90 days as the `%s` artifact of [run %s](%s) (`commits.bundle`, and the same commits as `changes.patch`), from `%s` to `%s`.\n\nReview them and add them to this branch from a worktree you control, as the handoff comment on #%s describes; delete the placeholder, which fails the required `py-test` checks while it exists; replace this title and body with the agent'"'"'s `pr-title.txt` and `pr-body.md`, keeping the `Fixes` line; then mark the PR ready.\n' \
              "$ISSUE" "$PLACEHOLDER" "$ARTIFACT" "$RUN_ID" "$RUN_URL" "$START" "$HEAD" "$ISSUE" >"$RUNNER_TEMP/draft-body.md"
            pr=$(gh pr create --draft --repo "$REPO" --base main --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/draft-body.md")
            state=open
            echo "Opened the draft PR $pr."
          fi
          echo "pr=$pr" >>"$GITHUB_OUTPUT"
          if [ "$state" = open ]; then
            gh pr edit "$pr" --repo "$REPO" --add-label inspect-update --add-assignee ransomr
          fi

      # Repo default the manifest cannot express: assign the PR like the
      # issue. Best-effort; runs whenever the land step got as far as a PR.
      - name: Assign the PR
        if: always() && steps.land.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.land.outputs.pr_number }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --add-assignee ransomr \
            || echo "::warning::Could not assign ransomr to #$PR."

      # Deterministic failure report on the RELEASE ISSUE (the gate's trusted
      # number), whatever failed: the agent job, a missing or refused
      # artifact, the push, the PR, a lost post, the manifest's own error
      # (the land composite fails the run for that after everything else
      # landed), the handoff's hold label or its draft PR. The composite
      # reports on the PR once one exists and knows nothing about the dedup,
      # so the recovery steps live here. Nothing from the agent job is interpolated into this
      # body.
      - name: Report the failure on the release issue
        if: always() && steps.mint.outcome == 'success' && (steps.land.outcome != 'success' || steps.hold.outcome == 'failure' || steps.draft.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          LATEST: ${{ needs.gate.outputs.latest }}
          AGENT_RESULT: ${{ needs.agent.result }}
          LAND_OUTCOME: ${{ steps.land.outcome }}
          HOLD_OUTCOME: ${{ steps.hold.outcome }}
          DRAFT_OUTCOME: ${{ steps.draft.outcome }}
          DRAFT_PR: ${{ steps.draft.outputs.pr }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          HANDOFF: ${{ steps.stage.outcome == 'success' && 'true' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          KEPT: ${{ steps.keep.outcome == 'success' && 'true' || '' }}
          ARTIFACT: inspect-update-handoff-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if [ "$LAND_OUTCOME" != "success" ]; then
            body=$(printf '⚠️ The weekly inspect-update run for inspect-ai %s did not complete (agent job: %s; landing: %s). Details: %s\n\nBecause this issue names the release, the weekly dedup treats inspect-ai %s as claimed, open or closed, until this issue is retitled or deleted. If a PR was opened for this release, close it and remove its inspect-update label; closing the PR or deleting its branch alone does not clear the dedup. Then re-trigger via workflow_dispatch on the Inspect Update workflow.\n' \
              "$LATEST" "$AGENT_RESULT" "$LAND_OUTCOME" "$RUN_URL" "$LATEST")
          else
            body=$(printf '⚠️ The weekly inspect-update run for inspect-ai %s handed its commits to the maintainer, but a step after the landing failed. Details: %s' "$LATEST" "$RUN_URL")
          fi
          # shellcheck disable=SC2016 # Markdown backticks, not expansions
          if [ -n "$HANDOFF" ] && [ "$HOLD_OUTCOME" = "failure" ]; then
            body+=$(printf '\n\nThe `maintainer-handoff` label could not be added to this issue, so the weekly run will start newer releases (whose changelog range contains this one) before this handoff lands. Add it by hand: `gh issue edit %s --repo %s --add-label maintainer-handoff`.' "$ISSUE" "$REPO")
          elif [ -n "$HANDOFF" ]; then
            body+=$(printf '\n\nThis run is a maintainer handoff and this issue carries the `maintainer-handoff` label: while the issue is open the weekly run starts no release, retitled or not. To finish it, apply the kept commits below from your own worktree as the handoff comment on this issue describes (if it was not posted: verify `commits.bundle`, fetch its `HEAD`, read every line, and add it to the draft PR%s, or open your own PR labelled `inspect-update` with `Fixes #%s`). To abandon this attempt and dispatch afresh instead, remove the `maintainer-handoff` label as well as retitling or deleting this issue, and close the draft PR if one was opened.' "${DRAFT_PR:+ $DRAFT_PR}" "$ISSUE")
          fi
          # shellcheck disable=SC2016 # Markdown backticks, not expansions
          if [ -n "$HANDOFF" ] && [ "$DRAFT_OUTCOME" = "failure" ] && [ -n "$DRAFT_PR" ]; then
            body+=$(printf '\n\nThe draft PR for this handoff, %s, was opened, but its `inspect-update` label or assignee could not be added: `gh pr edit %s --repo %s --add-label inspect-update --add-assignee ransomr`.' "$DRAFT_PR" "$DRAFT_PR" "$REPO")
          elif [ -n "$HANDOFF" ] && [ "$DRAFT_OUTCOME" = "failure" ]; then
            body+=$(printf '\n\nThe draft PR for this handoff could not be opened (see the run log). Re-running the failed land job while this run'"'"'s one-day `landing` artifact lasts opens it: a re-run adopts the branch `%s` and any PR from it that an earlier attempt made instead of duplicating them (it posts this run'"'"'s comments again). By hand instead, once the branch is on origin: `gh pr create --draft --repo %s --base main --head %s --title "chore: reconcile inspect-ai %s (maintainer handoff)" --body "Fixes #%s"`, then add the `inspect-update` label; if the branch is not on origin, open your own PR from the reviewed commits with that label and `Fixes #%s`.' \
              "$BRANCH" "$REPO" "$BRANCH" "$LATEST" "$ISSUE" "$ISSUE")
          fi
          # shellcheck disable=SC2016 # Markdown backticks, not expansions
          if [ -n "$KEPT" ]; then
            body+=$(printf '\n\nThe agent'"'"'s commits are not lost: they are kept for 90 days as the `%s` artifact of this run (`gh run download %s --repo %s --name %s`), as `commits.bundle` and `changes.patch`.' "$ARTIFACT" "$RUN_ID" "$REPO" "$ARTIFACT")
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$body" \
            || echo "::error::Could not post the failure report on #$ISSUE."
