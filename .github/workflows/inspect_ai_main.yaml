name: Inspect AI Main CI

on:
  schedule:
    # Runs every 3 hours
    - cron: "0 */3 * * *"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Flow's dependencies come from uv.lock; only inspect-ai main (and whatever it
# needs beyond the lock) is installed on top. Nothing here saves the uv cache,
# which Build restores under the same key.
permissions:
  contents: read

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          locked: true
          save-cache: false
      - name: Install inspect-ai main
        run: uv pip install git+https://github.com/UKGovernmentBEIS/inspect_ai.git
      - name: Lint with Ruff
        run: uv run --no-sync ruff check .
      - name: Format with Ruff
        run: uv run --no-sync ruff format --check .

  py-type:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          locked: true
          save-cache: false
      - name: Install inspect-ai main
        run: uv pip install git+https://github.com/UKGovernmentBEIS/inspect_ai.git
      - name: Type check with pyright
        run: uv run --no-sync pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          locked: true
          save-cache: false
      - name: Install inspect-ai main
        run: uv pip install git+https://github.com/UKGovernmentBEIS/inspect_ai.git
      - name: Run tests
        timeout-minutes: 10
        run: uv run --no-sync pytest --runslow

  check-type-gen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          locked: true
          save-cache: false
      - name: Install inspect-ai main
        run: uv pip install git+https://github.com/UKGovernmentBEIS/inspect_ai.git
      - name: Generate types
        run: uv run --no-sync python src/inspect_flow/_types/type_gen.py
      - name: Ensure schema and types changes are checked in
        run: |
          if [[ $(git status --porcelain) != "" ]]
          then
            echo "Generated types are out of date. Please run python src/inspect_flow/_types/type_gen.py and check in the changes."
            git status
            git diff
            exit 1
          fi
