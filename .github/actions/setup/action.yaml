name: Setup dev environment
description: Set up Python and install dependencies using uv

inputs:
  python-version:
    required: true
    description: Python version to use
  locked:
    required: false
    default: "false"
    description: Fail instead of re-locking when uv.lock is out of date
  save-cache:
    required: false
    default: "auto"
    description: Whether setup-uv saves the uv cache after the job

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: ${{ inputs.python-version }}
        save-cache: ${{ inputs.save-cache }}
    - name: Install dependencies with uv
      run: uv sync --dev ${{ inputs.locked == 'true' && '--locked' || '' }}
      shell: bash
