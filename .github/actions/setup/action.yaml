name: Setup dev environment
description: Set up Python and install dependencies using uv

inputs:
  python-version:
    required: true
    description: Python version to use
  locked:
    required: false
    default: "false"
    description: Fail instead of re-locking when uv.lock is out of date
  save-cache:
    required: false
    default: "auto"
    description: Whether setup-uv saves the uv cache after the job

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: ${{ inputs.python-version }}
        save-cache: ${{ inputs.save-cache }}
    - name: Install dependencies with uv
      run: uv sync --dev ${{ inputs.locked == 'true' && '--locked' || '' }}
      shell: bash
