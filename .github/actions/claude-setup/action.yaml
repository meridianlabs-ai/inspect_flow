name: Claude agent environment
description: >-
  Provision the project so Claude Code agents (dev + reviewer) can actually run
  pytest/ruff/pyright instead of falling back to static checks. Invoked by the
  workflows that run an agent in this repo (inspect-update.yml,
  inspect-ai-main-failure.yml). Those jobs hold `id-token: write`, so the
  install is exactly uv.lock (`--locked`) and restores no Actions cache.

runs:
  using: composite
  steps:
    - uses: meridianlabs-ai/actions/install-python-dependencies@3bc608093ab8b8dd7f82764a863d9d5f9dce61a5 # main
      with:
        versions: locked
        # CI runs a 3.11/3.14 matrix; the agent only needs one interpreter.
        python-version: "3.11"
        actions-cache: none
    # Put the uv-managed project venv on PATH so the agent's allow-listed bare
    # `pytest`/`ruff`/`pyright` resolve. Without this they aren't on PATH, so the
    # agent falls back to `.venv/bin/...` / `make check` — neither allow-listed —
    # and the verify loop is blocked (it then ships unverified, noting it could
    # not run the tools). Plain `run:` step (no post phase) so it's safe on the
    # fork dev agent too.
    - name: Put the project venv on PATH for the agent
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
