[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "inspect_flow"
dynamic = ["version"]
description = "Inspect Flow is a workflow stack built on Inspect AI that enables research organizations to run AI evaluations at scale"
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
dependencies = [
    "click>=8.2.1",
    "dateparser>=1.2.0",
    "deltalake>=0.18.0",
    "inspect-ai>=0.3.278",
    "inspect-scout>=0.4.41",
    "packaging>=21.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.12",
    "python-dotenv>=1.1.1",
    "typing_extensions>=4.10.0",
    "griffe>=1.0.0",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_flow"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_flow/issues"
Documentation = "https://meridianlabs-ai.github.io/inspect_flow/"

[project.scripts]
flow = "inspect_flow._cli.main:main"

[project.optional-dependencies]
doc = [
    "jupyter",
    "quarto-cli>=1.9.36",
    "panflute",
    "markdown",
    "click",
    "pyyaml",
    "types-PyYAML",
]
dev = [
    "anthropic",
    "datamodel-code-generator",
    "deepdiff",
    "flask",
    "flask-cors",
    "moto[s3]",
    "openai",
    "pre-commit",
    "pyarrow-stubs>=20.0.0.20251215",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-dotenv",
    "ruff",
    "ty",
    "types-pyyaml>=6.0.12.20250915",
]

[dependency-groups]
dev = ["inspect-flow[dev]", "local-eval"]

[tool.uv.sources]
local-eval = { path = "tests/local_eval", editable = true }


[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_flow/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
managed = true
add-bounds = "lower"
default-groups = ["dev"]
# CI runs on linux x86_64: skip releases whose wheels for it aren't published yet.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md).
exclude-newer = "7 days"

# 6 hours for direct dependencies that are a model provider SDK, and no
# cooldown for Inspect packages; see CONTRIBUTING.md.
[tool.uv.exclude-newer-package]
anthropic = "6 hours"
inspect-ai = false
inspect-scout = false
openai = "6 hours"

[tool.inspect_flow]
# Newest inspect-ai release whose CHANGELOG has been reconciled against flow's
# API surface, advanced by .github/workflows/inspect-update.yml. Independent of
# the `inspect-ai>=` dependency floor, which is only raised when a release
# would completely break flow on older versions.
inspect-reconciled-version = "0.3.288"

[tool.pyright]
include = ["src", "tests", "examples"]
reportUnknownParameterType = true

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = [
    "E203", # whitespace before ':'
    "E501", # line too long
    "D101", # Missing docstring in a pulic class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D105", # missing docstring in magic method
    "D107", # missing docstring in __init__
    "D212", # multi-line docstring summary should start at the first line
    "D415", # first line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/test_*.py", "*/src/inspect_flow/_types/type_gen.py"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
precision = 2
